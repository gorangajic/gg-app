version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gg-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ggapp
      POSTGRES_PASSWORD: ggapp_dev_password
      POSTGRES_DB: gg_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggapp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
