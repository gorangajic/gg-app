<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeWise AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>TypeWise AI</h1>
      <p class="subtitle">Writing Assistant</p>
    </div>

    <!-- Authentication View -->
    <div id="authView" class="view">
      <!-- Login Form -->
      <div id="loginForm" class="form-container">
        <h2>Sign In</h2>
        <form id="loginFormElement">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
          </div>
          <div id="loginError" class="error-message"></div>
          <button type="submit" class="btn btn-primary">Sign In</button>
          <button type="button" id="showRegister" class="btn btn-link">Create Account</button>
        </form>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="form-container hidden">
        <h2>Create Account</h2>
        <form id="registerFormElement">
          <div class="form-group">
            <label for="registerName">Name (optional)</label>
            <input type="text" id="registerName" placeholder="Your Name">
          </div>
          <div class="form-group">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" required placeholder="••••••••">
          </div>
          <div id="registerError" class="error-message"></div>
          <button type="submit" class="btn btn-primary">Create Account</button>
          <button type="button" id="showLogin" class="btn btn-link">Back to Sign In</button>
        </form>
      </div>
    </div>

    <!-- Authenticated View -->
    <div id="authenticatedView" class="view hidden">
      <div class="status-container">
        <div class="status-badge active">
          <span class="status-dot"></span>
          <span>Active</span>
        </div>
        <p class="status-message">TypeWise AI is monitoring your typing</p>
      </div>

      <div class="info-section">
        <h3>Features</h3>
        <ul class="feature-list">
          <li>✓ Grammar corrections</li>
          <li>✓ Style improvements</li>
          <li>✓ Clarity enhancements</li>
          <li>✓ Tone adjustments</li>
          <li>✓ Text rewriting</li>
        </ul>
      </div>

      <div class="actions">
        <button id="openOptions" class="btn btn-secondary">Settings</button>
        <button id="logoutBtn" class="btn btn-link">Sign Out</button>
      </div>
    </div>

    <!-- Loading View -->
    <div id="loadingView" class="view">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
